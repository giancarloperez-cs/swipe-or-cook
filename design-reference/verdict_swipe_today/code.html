<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FAF7F2;
            overscroll-behavior-y: contain;
        }
        .terracotta-gradient {
            background: linear-gradient(135deg, #E08A5E 0%, #D4734A 100%);
        }
        /* Custom scrollbar hiding for clean app feel */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-bright": "#fff8f6",
                    "on-secondary-container": "#446b51",
                    "background": "#fff8f6",
                    "on-primary-container": "#5f2501",
                    "tertiary-fixed": "#8ef3f6",
                    "on-secondary-fixed": "#002110",
                    "primary-fixed": "#ffdbcb",
                    "surface-container-low": "#fff1eb",
                    "on-primary-fixed": "#341100",
                    "surface-variant": "#efdfd9",
                    "on-secondary": "#ffffff",
                    "on-background": "#211a17",
                    "tertiary": "#00696c",
                    "on-primary-fixed-variant": "#74340f",
                    "on-primary": "#ffffff",
                    "secondary": "#40674d",
                    "surface-dim": "#e6d7d1",
                    "on-tertiary-fixed-variant": "#004f51",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed-dim": "#ffb692",
                    "inverse-on-surface": "#fdeee7",
                    "tertiary-container": "#44aeb1",
                    "on-tertiary-fixed": "#002021",
                    "on-tertiary-container": "#003d3f",
                    "on-secondary-fixed-variant": "#284e37",
                    "error": "#ba1a1a",
                    "on-error": "#ffffff",
                    "inverse-primary": "#ffb692",
                    "secondary-fixed": "#c2edcd",
                    "secondary-fixed-dim": "#a6d1b2",
                    "surface-container-high": "#f4e5df",
                    "surface-tint": "#924b25",
                    "tertiary-fixed-dim": "#70d6d9",
                    "error-container": "#ffdad6",
                    "outline": "#87736a",
                    "primary": "#924b25",
                    "inverse-surface": "#372f2b",
                    "surface-container-highest": "#efdfd9",
                    "primary-container": "#e08a5e",
                    "surface": "#fff8f6",
                    "on-tertiary": "#ffffff",
                    "on-surface": "#211a17",
                    "secondary-container": "#bfeaca",
                    "on-error-container": "#93000a",
                    "outline-variant": "#d9c2b8",
                    "surface-container": "#faebe5",
                    "on-surface-variant": "#54433c"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "safe-area": "24px",
                    "stack-md": "24px",
                    "stack-lg": "48px",
                    "gutter": "16px",
                    "stack-sm": "8px",
                    "touch-target": "56px"
            },
            "fontFamily": {
                    "h1": ["Plus Jakarta Sans"],
                    "body-md": ["Plus Jakarta Sans"],
                    "button": ["Plus Jakarta Sans"],
                    "h3": ["Plus Jakarta Sans"],
                    "label-caps": ["Plus Jakarta Sans"],
                    "body-lg": ["Plus Jakarta Sans"],
                    "h2": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "h1": ["40px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "button": ["18px", {"lineHeight": "1.0", "fontWeight": "600"}],
                    "h3": ["24px", {"lineHeight": "1.3", "fontWeight": "700"}],
                    "label-caps": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "h2": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body class="bg-surface-bright text-on-surface overflow-x-hidden no-scrollbar">
<!-- Header with Safe Area support -->
<nav class="fixed top-0 z-50 flex justify-between items-center w-full px-6 pt-[max(1rem,env(safe-area-inset-top))] pb-4 bg-white/80 backdrop-blur-md border-b border-outline-variant/10">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-black/5 transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<span class="text-orange-700 font-h1 text-2xl tracking-tighter">SwipeOrCook</span>
<div class="w-10 h-10 rounded-full bg-surface-container-highest overflow-hidden border border-outline-variant/30">
<img alt="Profile" class="w-full h-full object-cover" data-alt="close-up portrait of a stylish young student smiling in warm sunlight with soft urban background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDt3gAm-d8XiIpPWESJXShsVhW-Tykk5816OAgmgHMzMwdUtD-8Vl81QawjA5JSgqRB-MYCgDEZEFMKwd7V-wyw-DAeBK3VWgbNQTqAci0Oa0nAQzlh7iLU4QBcy86IKrzOYlYQShuvsgdJxrxSjlMIp2JcxyGhSTO08Quf2LI0p6HlBL-YX-Msqq4pnrlJz-SyOagRzQZXKUgmKGCs7mpq9mICKc4hqfnO0cvofwsNobwuPCe3bruOdRgxyTAeepRgxHtHIBK4yqM"/>
</div>
</nav>
<!-- Main Content Area -->
<main class="flex-1 w-full max-w-md mx-auto px-6 pt-[calc(max(1rem,env(safe-area-inset-top))+64px)] pb-[calc(100px+env(safe-area-inset-bottom))] flex flex-col items-center">
<!-- Hero Card - Responsive Aspect Ratio -->
<div class="w-full aspect-[3/4] max-h-[530px] terracotta-gradient rounded-[40px] shadow-2xl shadow-primary/20 flex flex-col items-center justify-center p-8 relative overflow-hidden group">
<div class="absolute inset-0 bg-white/5 opacity-20 pointer-events-none"></div>
<h1 class="font-h1 text-[15vw] sm:text-6xl text-white text-center leading-[0.9] z-10">
                Swipe<br/>today.
            </h1>
<div class="absolute bottom-6 right-6 text-white/30">
<span class="material-symbols-outlined text-[100px] sm:text-[120px]" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
</div>
<!-- Content Details -->
<div class="w-full mt-8 flex flex-col gap-6 animate-in fade-in slide-in-from-bottom-4 duration-700">
<div class="flex items-start justify-between gap-4">
<div class="flex-1">
<span class="font-label-caps text-primary uppercase tracking-widest block mb-1">The Grill</span>
<h2 class="font-h2 text-2xl sm:text-3xl text-on-surface leading-tight">Grilled Chicken &amp; Quinoa</h2>
</div>
<div class="flex flex-col items-end shrink-0">
<span class="font-h3 text-2xl text-secondary">420</span>
<span class="font-label-caps text-on-surface-variant">kcal</span>
</div>
</div>
<p class="font-body-lg text-on-surface-variant italic leading-relaxed">
                "dining hall's going off today 🔥"
            </p>
<!-- Macros Grid -->
<div class="grid grid-cols-3 gap-3">
<div class="p-4 bg-surface-container-low rounded-2xl border border-outline-variant/30 flex flex-col items-center justify-center text-center">
<span class="font-label-caps text-[10px] text-on-surface-variant block mb-1">PROTEIN</span>
<span class="font-button text-on-surface">32g</span>
</div>
<div class="p-4 bg-surface-container-low rounded-2xl border border-outline-variant/30 flex flex-col items-center justify-center text-center">
<span class="font-label-caps text-[10px] text-on-surface-variant block mb-1">CARBS</span>
<span class="font-button text-on-surface">45g</span>
</div>
<div class="p-4 bg-surface-container-low rounded-2xl border border-outline-variant/30 flex flex-col items-center justify-center text-center">
<span class="font-label-caps text-[10px] text-on-surface-variant block mb-1">FATS</span>
<span class="font-button text-on-surface">12g</span>
</div>
</div>
</div>
</main>
<!-- Floating Action Button - Fixed with safe area bottom padding -->
<div class="fixed bottom-0 left-0 right-0 px-6 pb-[max(1.5rem,env(safe-area-inset-bottom))] pt-8 bg-gradient-to-t from-surface-bright via-surface-bright/95 to-transparent flex justify-center z-40">
<button class="w-full max-w-sm h-14 terracotta-gradient rounded-full text-white font-button shadow-xl shadow-primary/30 active:scale-95 transition-transform duration-200 flex items-center justify-center gap-3">
<span>Tap to see full menu</span>
<span class="material-symbols-outlined">expand_less</span>
</button>
</div>
</body></html>
