<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>SwipeOrCook - Home</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {

                        "surface-bright": "#fff8f6",

                        "background": "#fff8f6",

                        "on-secondary-fixed": "#002110",

                        "surface-container-low": "#fff1eb",

                        "surface-variant": "#efdfd9",
                        "on-secondary": "#ffffff",
                        "on-background": "#211a17",
                        "tertiary": "#00696c",
                        "on-primary-fixed-variant": "#74340f",
                        "on-primary": "#ffffff",
                        "secondary": "#40674d",
                        "surface-dim": "#e6d7d1",
                        "on-tertiary-fixed-variant": "#004f51",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#ffb692",
                        "inverse-on-surface": "#fdeee7",
                        "tertiary-container": "#44aeb1",
                        "on-tertiary-fixed": "#002021",
                        "on-tertiary-container": "#003d3f",
                        "on-secondary-fixed-variant": "#284e37",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "inverse-primary": "#ffb692",
                        "secondary-fixed": "#c2edcd",
                        "secondary-fixed-dim": "#a6d1b2",

                        "primary": "#924b25",
                        "inverse-surface": "#372f2b",
                        "surface-container-highest": "#efdfd9",
                        "primary-container": "#e08a5e",
                        "surface": "#fff8f6",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#211a17",
                        "secondary-container": "#bfeaca",
                        "on-error-container": "#93000a",
                        "outline-variant": "#d9c2b8",
                        "surface-container": "#faebe5",
                        "on-surface-variant": "#54433c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "safe-area": "24px",
                        "stack-md": "24px",
                        "stack-lg": "48px",
                        "gutter": "16px",
                        "stack-sm": "8px",
                        "touch-target": "56px"
                    },
                    "fontFamily": {
                        "h1": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "button": ["Plus Jakarta Sans"],
                        "h3": ["Plus Jakarta Sans"],
                        "label-caps": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "h2": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "h1": ["40px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "button": ["18px", {"lineHeight": "1.0", "fontWeight": "600"}],
                        "h3": ["24px", {"lineHeight": "1.3", "fontWeight": "700"}],
                        "label-caps": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "h2": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overscroll-behavior-y: none;
        }
        /* Mobile optimization: Fixed height to prevent layout shifts */
        .min-h-screen-ios {
            min-height: 100vh;
            min-height: -webkit-fill-available;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen-ios flex flex-col font-body-md overflow-x-hidden">
<!-- TopAppBar -->
<header class="bg-white/80 backdrop-blur-md fixed top-0 z-50 w-full flex justify-between items-center px-6 pt-[calc(1rem+env(safe-area-inset-top))] pb-4 border-none">
<button class="hover:opacity-80 transition-opacity scale-95 active:scale-90 transition-transform duration-200 text-orange-600 flex items-center justify-center w-10 h-10">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="text-2xl font-extrabold tracking-tighter text-orange-700 font-h1">SwipeOrCook</h1>
<div class="hover:opacity-80 transition-opacity scale-95 active:scale-90 transition-transform duration-200">
<img alt="User Profile" class="w-10 h-10 rounded-full object-cover border-2 border-surface-container" data-alt="close-up portrait of a friendly young person with a warm smile, natural lighting, soft bokeh background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBrJvO7EvLiLuymhgyANuvgndwce4ReQrNfb3uptG3hKuh-yYhDUc5UCwezNHbkLDCA5HF4VsKr5c2SLyUdD0p0XTZiWZREhkYCNT7y-u1avoTEI8efCkn5H2v6L-JJxSAd6w4VEO59OJP5xgGbHHUH2__4JB8Aea6x95x2u9Es3wY4ftTpWe2Ey6_BGlu9MctiU-_GD9shxJnVDzhbgpywrv-blCo5Clc4l0lg4IIyEAGjTDnNfWM1h7KBxxCuH6wKEwFoXEgZ5Ic"/>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-gutter pt-[calc(100px+env(safe-area-inset-top))] pb-[calc(40px+env(safe-area-inset-bottom))]">
<!-- Hero Section -->
<div class="w-full max-w-sm text-center flex flex-col items-center space-y-stack-md sm:space-y-stack-lg">
<!-- Microcopy -->
<div class="space-y-stack-sm">
<p class="font-h1 text-h1 text-on-background leading-tight">
                    what are we doing tonight?
                </p>
<div class="h-1.5 w-12 bg-primary rounded-full mx-auto opacity-20"></div>
</div>
<!-- Visual Anchor (Editorial Illustration) -->
<div class="relative w-full aspect-square max-w-[300px]">
<div class="absolute inset-0 bg-secondary-container rounded-[48px] rotate-3 opacity-20"></div>
<img alt="Artisanal meal ingredients" class="relative z-10 w-full h-full object-cover rounded-[48px] shadow-2xl shadow-on-background/5" data-alt="minimalist overhead shot of fresh organic vegetables and rustic bread on a light stone surface, editorial food photography" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBgT1Ib6rLU86LWVq7dfAmzHVRje_xUW3oXUqFPKi1QNMBDI2l_vMjwtylQJNYnr_OwpALUcAB9-Dt1-G3Hxp61L1OaTrolKQPU7hnV_xI5Bn_Xt-x6ue8NT1ggZ4E1cgLrYTJhD_ya3INhKrnNgckdUqdi2BrhjuDbHBo1UGmV4me-02j2Zr6zl-qUxRlBfL9sotE0loiAldi4Iv5_c2JRfc6bSL6-zMkGdZ9Dh-G5xo9boILNU_X7bR_hQ9SvilDTMEX1WiqIqHc"/>
</div>
<!-- Action Cluster -->
<div class="w-full flex flex-col items-center space-y-stack-md">
<!-- Savings Banner -->
<div class="bg-secondary-container/30 px-5 py-2.5 rounded-full flex items-center space-x-2">
<span class="material-symbols-outlined text-on-secondary-container scale-75" data-icon="savings" style="font-variation-settings: 'FILL' 1;">savings</span>
<span class="font-label-caps text-on-secondary-container text-[11px] uppercase tracking-wider">$47 saved this week · 3 orders skipped</span>
</div>
<!-- CTA Button -->
<button class="w-full h-touch-target bg-primary text-on-primary rounded-full font-button text-button shadow-xl shadow-primary/25 hover:opacity-90 active:scale-[0.98] transition-all duration-300">
                    I'm hungry
                </button>
<!-- Goal Picker -->
<div class="w-full flex flex-wrap justify-center gap-2 pt-2">
<button class="px-4 py-2 rounded-full border border-outline-variant hover:bg-surface-container active:bg-surface-container-high transition-colors text-on-surface-variant font-label-caps text-[10px] flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-tertiary"></span>
                        eat more protein
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant hover:bg-surface-container active:bg-surface-container-high transition-colors text-on-surface-variant font-label-caps text-[10px] flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
                        stop feeling sluggish
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant hover:bg-surface-container active:bg-surface-container-high transition-colors text-on-surface-variant font-label-caps text-[10px] flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary-container"></span>
                        spend less
                    </button>
</div>
</div>
</div>
<!-- Minimalist Background Accent Elements -->
<div class="fixed top-1/4 -left-20 w-64 h-64 bg-primary/5 rounded-full blur-[100px] -z-10 pointer-events-none"></div>
<div class="fixed bottom-1/4 -right-20 w-64 h-64 bg-secondary/5 rounded-full blur-[100px] -z-10 pointer-events-none"></div>
</main>
<!-- Bottom Spacing for Tab Bar if present in future, or just general padding -->
<footer class="h-[env(safe-area-inset-bottom)] pointer-events-none bg-transparent"></footer>
</body></html>
