<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-bright": "#fff8f6",
                    "on-secondary-container": "#446b51",
                    "background": "#fff8f6",
                    "on-primary-container": "#5f2501",
                    "tertiary-fixed": "#8ef3f6",
                    "on-secondary-fixed": "#002110",
                    "primary-fixed": "#ffdbcb",
                    "surface-container-low": "#fff1eb",
                    "on-primary-fixed": "#341100",
                    "surface-variant": "#efdfd9",
                    "on-secondary": "#ffffff",
                    "on-background": "#211a17",
                    "tertiary": "#00696c",
                    "on-primary-fixed-variant": "#74340f",
                    "on-primary": "#ffffff",
                    "secondary": "#40674d",
                    "surface-dim": "#e6d7d1",
                    "on-tertiary-fixed-variant": "#004f51",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed-dim": "#ffb692",
                    "inverse-on-surface": "#fdeee7",
                    "tertiary-container": "#44aeb1",
                    "on-tertiary-fixed": "#002021",
                    "on-tertiary-container": "#003d3f",
                    "on-secondary-fixed-variant": "#284e37",
                    "error": "#ba1a1a",
                    "on-error": "#ffffff",
                    "inverse-primary": "#ffb692",
                    "secondary-fixed": "#c2edcd",
                    "secondary-fixed-dim": "#a6d1b2",
                    "surface-container-high": "#f4e5df",
                    "surface-tint": "#924b25",
                    "tertiary-fixed-dim": "#70d6d9",
                    "error-container": "#ffdad6",
                    "outline": "#87736a",
                    "primary": "#924b25",
                    "inverse-surface": "#372f2b",
                    "surface-container-highest": "#efdfd9",
                    "primary-container": "#e08a5e",
                    "surface": "#fff8f6",
                    "on-tertiary": "#ffffff",
                    "on-surface": "#211a17",
                    "secondary-container": "#bfeaca",
                    "on-error-container": "#93000a",
                    "outline-variant": "#d9c2b8",
                    "surface-container": "#faebe5",
                    "on-surface-variant": "#54433c"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "safe-area": "16px",
                    "stack-md": "16px",
                    "stack-lg": "32px",
                    "gutter": "16px",
                    "stack-sm": "8px",
                    "touch-target": "56px"
            },
            "fontFamily": {
                    "h1": ["Plus Jakarta Sans"],
                    "body-md": ["Plus Jakarta Sans"],
                    "button": ["Plus Jakarta Sans"],
                    "h3": ["Plus Jakarta Sans"],
                    "label-caps": ["Plus Jakarta Sans"],
                    "body-lg": ["Plus Jakarta Sans"],
                    "h2": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "h1": ["40px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "button": ["18px", {"lineHeight": "1.0", "fontWeight": "600"}],
                    "h3": ["24px", {"lineHeight": "1.3", "fontWeight": "700"}],
                    "label-caps": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "h2": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #FAF7F2;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: none;
        }
        .sage-gradient {
            background: linear-gradient(135deg, #7FA88B 0%, #A5C2A0 100%);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Mobile App Optimization */
        .min-h-screen-ios {
            min-height: -webkit-fill-available;
            height: 100dvh;
        }
    </style>
</head>
<body class="font-body-md text-on-surface selection:bg-primary/10">
<header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-4 py-3 pt-[env(safe-area-inset-top,12px)]">
<button class="flex h-10 w-10 items-center justify-center rounded-full bg-white/60 backdrop-blur-lg text-on-surface-variant hover:bg-white transition-all active:scale-90">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<div class="font-h3 text-primary tracking-tighter text-lg">SwipeOrCook</div>
<div class="w-10"></div>
</header>
<main class="min-h-screen-ios flex flex-col items-center justify-between px-4 pt-[calc(60px+env(safe-area-inset-top,0px))] pb-[calc(100px+env(safe-area-inset-bottom,0px))] max-w-lg mx-auto">
<!-- Verdict Card (Flexible height based on screen) -->
<div class="relative w-full flex-grow flex-shrink min-h-[380px] max-h-[520px] sage-gradient rounded-[48px] p-8 flex flex-col justify-between overflow-hidden shadow-2xl shadow-secondary/15">
<!-- Background Decal -->
<div class="absolute -top-12 -right-12 opacity-10 pointer-events-none">
<span class="material-symbols-outlined text-[280px] text-white" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<div class="relative z-10">
<div class="flex gap-2 mb-4">
<span class="bg-white/15 backdrop-blur-md px-3 py-1.5 rounded-full font-label-caps text-[10px] text-white border border-white/10">
                    12 MIN
                </span>
<span class="bg-white/15 backdrop-blur-md px-3 py-1.5 rounded-full font-label-caps text-[10px] text-white border border-white/10">
                    $4.20
                </span>
</div>
<h1 class="font-h1 text-[56px] text-white leading-[0.95] tracking-tighter">
                Cook<br/>tonight.
            </h1>
</div>
<div class="relative z-10 flex flex-col items-start gap-4">
<h3 class="font-h3 text-white leading-tight max-w-[80%]">
                15-Minute Pesto Pasta
            </h3>
<div class="w-20 h-20 rounded-2xl overflow-hidden border-2 border-white/40 -rotate-3 shadow-xl ring-4 ring-black/5">
<img alt="Pesto Pasta" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBoeTBVPBtWndBnucelGuXNGeNP5umoGH4pjr1XitWZ7wVb_stwKHJ292FTdu9qWb0LH3O1HBjKxX_PFmWg5P68WSzyAaSTRr6VTn4BwCkMucVldgRM8YKhr8Ilhxnf4v1WTbNyYT7tIoVJx0J-giX3rbAJ_rbfJKrNmunT5L0ndRfxlgHzKzYKg9nmLLCOxgcyQGhhyaI0D4UzjOgA4yA1JfN2KJdgGSE_FwQgo8Fcj1f0C42xqvx8oWAiSO58LNxQArapoUvA6QU"/>
</div>
</div>
</div>
<!-- Comparison and Action Area -->
<div class="w-full space-y-4 mt-6">
<!-- Comparison Row -->
<div class="w-full flex items-center justify-between bg-white p-5 rounded-[28px] shadow-sm ring-1 ring-black/[0.03]">
<div>
<p class="font-label-caps text-[10px] text-on-surface-variant mb-1 opacity-70">DOORDASH EQUIVALENT</p>
<p class="font-h3 text-on-surface/50 line-through decoration-error/40 text-xl">$28.50</p>
</div>
<div class="text-right">
<p class="font-label-caps text-secondary font-bold text-[10px] mb-1">TOTAL SAVED</p>
<p class="font-h1 text-secondary text-4xl tracking-tight">$24.30</p>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full h-[64px] bg-primary text-on-primary font-button text-lg rounded-[24px] shadow-xl shadow-primary/20 active:scale-[0.98] transition-all duration-200">
            Tap to see recipe
        </button>
</div>
<!-- Footer Accent -->
<p class="mt-6 font-label-caps text-[10px] text-on-surface-variant/60 tracking-[0.2em] uppercase text-center">
        Smarter Student Living
    </p>
</main>
<!-- Floating Bottom Nav -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 mb-[env(safe-area-inset-bottom,0px)]">
<div class="flex items-center gap-1 bg-stone-900/95 backdrop-blur-2xl rounded-full p-1.5 border border-white/10 shadow-2xl ring-1 ring-white/5">
<button class="flex items-center gap-2 px-5 py-2.5 rounded-full text-stone-400 font-label-caps text-[11px] transition-all hover:text-white">
<span class="material-symbols-outlined text-[18px]">swipe</span>
<span>SWIPE</span>
</button>
<button class="flex items-center gap-2 px-6 py-2.5 rounded-full bg-white/10 text-white font-label-caps text-[11px] shadow-inner ring-1 ring-white/10">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">restaurant</span>
<span>COOK</span>
</button>
</div>
</div>
</body></html>
